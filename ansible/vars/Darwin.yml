# macOS (Darwin) specific package names and settings

darwin_brew_packages:
  # GNU Utilities
  - coreutils
  - gnu-sed
  - gnu-tar
  - gnu-indent
  - gnu-which
  - findutils
  # CLI Tools
  - git
  - jq
  - direnv
  - kubectl
  - podman
  # Package manager helper
  - stow
  # Shell utilities
  - zsh
  - zsh-autosuggestions
  - bash

darwin_cask_packages:
  - visual-studio-code
  - brave-browser
  - obsidian
  - rectangle
  - iterm2
  - bruno

# NAS SMB automount (LaunchAgent runs mac/mount_nas.sh, keychain auth).
# Host, user and share are already public in the Linux NAS mount configs.
nas_host: "HomeCloud"
nas_share: "SharedLand"
nas_user: "Boris"
nas_mount_path: "NAS"
