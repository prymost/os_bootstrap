---
- name: Run macOS configurations script
  ansible.builtin.script:
    cmd: "{{ playbook_dir | dirname }}/mac/setup/configure_osx.sh"

- name: Don't display warning when quitting iTerm
  community.general.osx_defaults:
    domain: com.googlecode.iterm2
    key: PromptOnQuit
    type: bool
    value: false

- name: Restart affected macOS applications
  ansible.builtin.shell: killall "{{ item }}" || true
  loop:
    - "Activity Monitor"
    - "cfprefsd"
    - "Dock"
    - "Finder"
    - "SystemUIServer"
  changed_when: false
