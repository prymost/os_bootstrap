---
# ── 1. SECRETS PRESENCE CHECK & BOOTSTRAP RESTORE ───────────────────────────

- name: Check if local secrets file exists
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/vars/secrets.yml"
  register: secrets_stat

- name: Check if secrets backup archive exists on NAS
  ansible.builtin.stat:
    path: "{{ secrets_backup_dir }}/secrets-latest.tar.gz.age"
  register: nas_backup_stat

- name: Pause and instruct user to restore secrets from NAS
  ansible.builtin.pause:
    prompt: |

      ========================================================================
      🔓 [ACTION REQUIRED] Secrets Restore Needed
      ========================================================================
      A backup archive was detected at:
        {{ secrets_backup_dir }}/secrets-latest.tar.gz.age

      Open another terminal and run the interactive restore:
        cd {{ playbook_dir | dirname }}; ./backup_restore.sh restore

      Press [Enter] once finished to continue provisioning,
      or Ctrl+C then 'A' to abort.
      ========================================================================
  when:
    - not secrets_stat.stat.exists
    - nas_backup_stat.stat.exists

- name: Re-check if local secrets file was restored
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/vars/secrets.yml"
  register: secrets_stat_post
  when:
    - not secrets_stat.stat.exists
    - nas_backup_stat.stat.exists

- name: Fail if secrets were not restored
  ansible.builtin.fail:
    msg: >
      Secrets file '{{ playbook_dir }}/vars/secrets.yml' was not found.
      Please run './backup_restore.sh restore' before continuing.
  when:
    - not secrets_stat.stat.exists
    - nas_backup_stat.stat.exists
    - not secrets_stat_post.stat.exists

- name: Inform user if no secrets and no backup archive exist
  ansible.builtin.debug:
    msg: >
      [INFO] No secrets.yml found and no existing backup archive at
      {{ secrets_backup_dir }}/secrets-latest.tar.gz.age.
      After provisioning, run './backup_restore.sh genkey' and './backup_restore.sh backup'
      to initialize and create your first secrets backup.
  when:
    - not secrets_stat.stat.exists
    - not nas_backup_stat.stat.exists

# ── 2. GIT REMOTE CONFIGURATION (HTTPS -> SSH) ──────────────────────────────

- name: Check current git remote origin URL for os_bootstrap
  ansible.builtin.command:
    cmd: git remote get-url origin
    chdir: "{{ playbook_dir | dirname }}"
  register: git_remote_origin
  become: no
  changed_when: false
  failed_when: false

- name: Switch os_bootstrap git remote origin from HTTPS to SSH
  ansible.builtin.command:
    cmd: >-
      git remote set-url origin {{ git_remote_origin.stdout | regex_replace('^https?://(?:[^@]+@)?github\.com/([^/]+)/([^/]+?)(\.git)?$', 'git@github.com:\1/\2.git') }}
    chdir: "{{ playbook_dir | dirname }}"
  become: no
  when:
    - git_remote_origin.rc == 0
    - git_remote_origin.stdout is search('^https?://([^@]+@)?github\.com/')

