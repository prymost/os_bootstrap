---
# ── 1. DOTFILES RESTORATION (GNU STOW) ───────────────────────────────────

- name: Check status of dotfiles to prevent overwriting symlinks
  ansible.builtin.stat:
    path: "{{ ansible_facts.env.HOME }}/{{ item }}"
  loop:
    - .zshrc
    - .vimrc
    - .config/kitty/kitty.conf
  register: dotfile_stats

# Prevent deleting repo files when their parent directories are symlinked
- name: Remove existing physical dotfiles to prevent Stow conflicts
  ansible.builtin.file:
    path: "{{ item.stat.path }}"
    state: absent
  loop: "{{ dotfile_stats.results }}"
  when: item.stat.exists and not (item.stat.path | realpath).startswith(playbook_dir | dirname + '/shared/')

- name: Link dotfiles using GNU Stow
  ansible.builtin.command:
    cmd: "stow -d {{ playbook_dir | dirname }}/shared -t {{ ansible_facts.env.HOME }} zsh vim kitty"
  become: yes
  become_user: boris

# ── 2. USER ENVIRONMENT (ZSH, OMZ, KITTY) ────────────────────────────────

- name: Ensure user shell is Zsh
  ansible.builtin.user:
    name: boris
    shell: /bin/zsh

- name: Check if Oh My Zsh is installed
  ansible.builtin.stat:
    path: "{{ ansible_facts.env.HOME }}/.oh-my-zsh"
  register: omz_stat

- name: Install Oh My Zsh
  ansible.builtin.shell: sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended
  become: yes
  become_user: boris
  when: not omz_stat.stat.exists

- name: Clone Oh My Zsh custom plugins
  ansible.builtin.git:
    repo: "{{ item.repo }}"
    dest: "{{ ansible_facts.env.HOME }}/.oh-my-zsh/custom/plugins/{{ item.name }}"
    depth: 1
  loop:
    - {
        name: "zsh-autosuggestions",
        repo: "https://github.com/zsh-users/zsh-autosuggestions",
      }
    - {
        name: "zsh-syntax-highlighting",
        repo: "https://github.com/zsh-users/zsh-syntax-highlighting.git",
      }
  become: yes
  become_user: boris

- name: Check if Kitty Terminal is installed
  ansible.builtin.stat:
    path: "{{ ansible_facts.env.HOME }}/.local/bin/kitty"
  register: kitty_stat

- name: Install and configure Kitty Terminal
  ansible.builtin.script: files/install-kitty.sh
  become: yes
  become_user: boris
  when: not kitty_stat.stat.exists

# ── 3. PIBOX SANDBOX CONFIGURATION ───────────────────────────────────────

- name: Ensure ~/.config directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.config"
    state: directory
    owner: boris
    group: boris
    mode: '0755'

- name: Initialize ~/.config/pi-sandbox.env from example if not exists
  ansible.builtin.copy:
    src: "{{ playbook_dir | dirname }}/linux/pibox/pi-sandbox.env.example"
    dest: "{{ ansible_facts.env.HOME }}/.config/pi-sandbox.env"
    owner: boris
    group: boris
    mode: '0600'
    force: no

- name: Check if Docker is installed
  ansible.builtin.command: which docker
  register: docker_check
  failed_when: false
  changed_when: false
  become: yes
  become_user: boris

- name: Build initial pibox docker container
  ansible.builtin.command:
    cmd: "docker build --pull -t pibox:latest {{ playbook_dir | dirname }}/linux/pibox"
  become: yes
  become_user: boris
  when: docker_check.rc == 0

