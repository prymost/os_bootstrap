---
# ── 1. OH MY ZSH SETUP ────────────────────────────────────────────────────

- name: Check if Oh My Zsh is installed
  ansible.builtin.stat:
    path: "{{ ansible_facts.env.HOME }}/.oh-my-zsh"
  register: omz_stat

- name: Install Oh My Zsh (unattended)
  ansible.builtin.shell:
    cmd: sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended
  when: not omz_stat.stat.exists

- name: Clone Oh My Zsh custom plugins
  ansible.builtin.git:
    repo: "{{ item.repo }}"
    dest: "{{ ansible_facts.env.HOME }}/.oh-my-zsh/custom/plugins/{{ item.name }}"
    depth: 1
  loop:
    - {
        name: "zsh-autosuggestions",
        repo: "https://github.com/zsh-users/zsh-autosuggestions",
      }
    - {
        name: "zsh-syntax-highlighting",
        repo: "https://github.com/zsh-users/zsh-syntax-highlighting.git",
      }

# ── 2. DOTFILES LINKING via GNU STOW ─────────────────────────────────────

- name: Check status of dotfiles to prevent overwriting symlinks
  ansible.builtin.stat:
    path: "{{ ansible_facts.env.HOME }}/{{ item }}"
  loop:
    - .zshrc
    - .vimrc
    - .config/kitty/kitty.conf
  register: dotfile_stats

- name: Remove existing physical dotfiles to prevent Stow conflicts
  ansible.builtin.file:
    path: "{{ item.stat.path }}"
    state: absent
  loop: "{{ dotfile_stats.results }}"
  when: item.stat.exists and not (item.stat.path | realpath).startswith(playbook_dir | dirname + '/shared/')

- name: Link dotfiles using GNU Stow
  ansible.builtin.command:
    cmd: "stow --restow -d {{ playbook_dir | dirname }}/shared -t {{ ansible_facts.env.HOME }} zsh vim kitty"
  changed_when: false

# ── 3. GIT CONFIGURATION ──────────────────────────────────────────────────

- name: Configure global Git settings
  community.general.git_config:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    scope: global
  loop:
    - { name: "push.autoSetupRemote", value: "true" }
    - { name: "push.default", value: "current" }
    - { name: "core.editor", value: "code -n -w" }
    - { name: "remote.origin.prune", value: "true" }

# ── 4. CONTAINER RUNTIME (PODMAN) ────────────────────────────────────────

- name: Check if a podman machine exists
  ansible.builtin.command: podman machine list --format json
  register: podman_machine_list
  changed_when: false

- name: Initialize podman machine
  ansible.builtin.command: podman machine init
  when: podman_machine_list.stdout | trim == '[]'

- name: Start podman machine
  ansible.builtin.command: podman machine start
  register: podman_machine_start
  failed_when: podman_machine_start.rc != 0 and 'already running' not in podman_machine_start.stderr
  changed_when: podman_machine_start.rc == 0

# ── 5. PIBOX SANDBOX CONFIGURATION ───────────────────────────────────────

- name: Ensure ~/.config directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.config"
    state: directory
    mode: '0755'

- name: Initialize ~/.config/pi-sandbox.env from example if not exists
  ansible.builtin.copy:
    src: "{{ playbook_dir | dirname }}/linux/pibox/pi-sandbox.env.example"
    dest: "{{ ansible_facts.env.HOME }}/.config/pi-sandbox.env"
    mode: '0600'
    force: no

- name: Check if podman is installed
  ansible.builtin.command: which podman
  register: podman_check
  failed_when: false
  changed_when: false

- name: Build initial pibox container image
  ansible.builtin.command:
    cmd: "podman build --pull -t pibox:latest {{ playbook_dir | dirname }}/linux/pibox"
  when: podman_check.rc == 0
