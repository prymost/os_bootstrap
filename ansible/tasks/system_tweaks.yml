---
# ── 1. PERFORMANCE AND KERNEL TWEAKS ─────────────────────────────────────

- name: Apply sysctl swappiness value
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "10"
    state: present
    sysctl_set: yes
    reload: yes

- name: Apply sysctl max_user_watches limits
  ansible.posix.sysctl:
    name: fs.inotify.max_user_watches
    value: "524288"
    state: present
    sysctl_set: yes
    reload: yes

- name: Enable periodic SSD TRIM service
  ansible.builtin.systemd:
    name: fstrim.timer
    enabled: yes
    state: started

# ── 2. ZSA VOYAGER KEYBOARD CONFIGURATION ────────────────────────────────

- name: Ensure plugdev group exists
  ansible.builtin.group:
    name: plugdev
    state: present

- name: Add user boris to plugdev group
  ansible.builtin.user:
    name: boris
    groups: plugdev
    append: yes

- name: Write udev rules for ZSA Voyager
  ansible.builtin.copy:
    src: files/50-zsa.rules
    dest: /etc/udev/rules.d/50-zsa.rules
    owner: root
    group: root
    mode: "0644"
  register: udev_rules

- name: Reload udev rules
  ansible.builtin.shell: udevadm control --reload-rules && udevadm trigger
  when: udev_rules.changed

# ── 3. DOCKER CONFIGURATION ──────────────────────────────────────────────

- name: Ensure docker group exists
  ansible.builtin.group:
    name: docker
    state: present

- name: Add user boris to docker group
  ansible.builtin.user:
    name: boris
    groups: docker
    append: yes

- name: Enable and start Docker service
  ansible.builtin.systemd:
    name: docker
    enabled: yes
    state: started

# ── 4. DDC/CI MONITOR CONTROL PERMISSIONS ────────────────────────────────

- name: Ensure i2c group exists
  ansible.builtin.group:
    name: i2c
    state: present

- name: Add user to i2c group for unprivileged ddcutil access
  ansible.builtin.user:
    name: "{{ target_user }}"
    groups: i2c
    append: yes

- name: Ensure i2c-dev kernel module is loaded at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/i2c-dev.conf
    content: "i2c-dev\n"
    owner: root
    group: root
    mode: "0644"

- name: Load i2c-dev kernel module immediately
  community.general.modprobe:
    name: i2c-dev
    state: present

